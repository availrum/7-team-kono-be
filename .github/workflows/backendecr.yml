name: Backend CI/CD (Docker build + Push to ECR)

on:
  push:
    branches: ["fix/prod"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Spring Boot app
        run: ./gradlew build -x test -x spotlessJavaCheck -x sentryBundleSourcesJava

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        run: |
          aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 767398103411.dkr.ecr.ap-northeast-2.amazonaws.com

      - name: Debug - Show directory structure
        run: ls -R

      - name: Rename built jar to app.jar
        run: cp build/libs/*.jar app.jar

      - name: Build, tag, and push Docker image to ECR
        run: |
          IMAGE_URI=767398103411.dkr.ecr.ap-northeast-2.amazonaws.com/kono-backend:latest
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI